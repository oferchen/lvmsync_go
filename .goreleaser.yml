# .goreleaser.yml
version: '1'

builds:
  - id: default
    main: ./main.go
    binary: lvmsync_go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - GO111MODULE: on
      - CGO_ENABLED: 1
      - CGO_CFLAGS: -I/usr/include      
    ldflags:
      - -s -w -X main.version={{ .Env.GORELEASER_CURRENT_TAG }}

archives:
  - id: default
    builds:
      - default
    format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Env.GORELEASER_CURRENT_TAG }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    draft: false
    prerelease: false
    name_template: '{{ .Env.GORELEASER_CURRENT_TAG }}'
