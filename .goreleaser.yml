---
# OVERHEAD: GoReleaser config aligned to Alpine multi-stage Dockerfile.
# - Single-source name via anchor (&name) reused for build id, binary, and Docker ids.
# - Docker images are built FROM source inside Dockerfile (no prebuilt ids), so they work on Alpine (musl).
# - Docker pushes remain conditional on SKIP_DOCKER_PUSH.
# - Multi-arch images + manifests; GoReleaser passes BIN/BUILD_PATH build args.

project_name: &name bpm

builds:
  - id: *name
    binary: *name
    env: [CGO_ENABLED=1]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    builds: [*name]
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    format_overrides:
      - goos: linux
        format: tar.gz
      - goos: darwin
        format: tar.gz

checksum:
  name_template: '{{ .ProjectName }}-{{ .Version }}-checksums.txt'

dockers:
  # Build per-arch images from Dockerfile (multi-stage Alpine)
  - id: *name-amd64
    use: buildx
    dockerfile: Dockerfile
    platforms: ["linux/amd64"]
    image_templates:
      - docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-amd64
      - ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-amd64
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--build-arg=BIN={{ .ProjectName }}"
      - "--build-arg=BUILD_PATH=."

  - id: *name-arm64
    use: buildx
    dockerfile: Dockerfile
    platforms: ["linux/arm64"]
    image_templates:
      - docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8
      - ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--build-arg=BIN={{ .ProjectName }}"
      - "--build-arg=BUILD_PATH=."

docker_manifests:
  - name_template: "docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}"
    image_templates:
      - "docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8"
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'
  - name_template: "ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}"
    image_templates:
      - "ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8"
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'
  
