# .goreleaser.yml
version: '1'

builds:
  - id: default
    main: ./main.go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X main.version={{.Version}}
    binary: lvmsync_go

archives:
  - id: default
    builds:
      - default
    format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    # These are inferred by default if using GitHub Actions
    # owner: your_github_username_or_org
    # name: your_repo_name
