version: 2

builds:
  - id: default
    main: ./main.go
    binary: lvmsync_go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - GO111MODULE=on
      - CGO_ENABLED=1
      - CGO_CFLAGS=-I/usr/include
    ldflags:
      - -s -w -X main.version={{ .Env.GORELEASER_CURRENT_TAG }}
    asmflags:
      - all=-trimpath={{ .ProjectDir }}
    gcflags:
      - all=-trimpath={{ .ProjectDir }}

archives:
  - id: default
    ids:
      - default
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Env.GORELEASER_CURRENT_TAG }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git
  sort: desc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

dockers:
  - image_templates:
      - "docker.io/yourorg/lvmsync_go:{{ .Version }}"
      - "docker.io/yourorg/lvmsync_go:latest"
      - "ghcr.io/yourorg/lvmsync_go:{{ .Version }}"
      - "ghcr.io/yourorg/lvmsync_go:latest"
    dockerfile: ./Dockerfile
    use: buildx
    goos: linux
    build_flag_templates:
      - "--platform=linux/{{ .Arch }}"
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'

release:
  draft: false
  prerelease: false
  name_template: '{{ .Env.GORELEASER_CURRENT_TAG }}'
