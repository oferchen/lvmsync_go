# OVERHEAD: GoReleaser config aligned to distroless runtime image.
# - Single-source name via anchor (&name) reused for build id, binary, and Docker ids.
# - Docker images are built FROM source inside Dockerfile (no prebuilt ids), using
#   distroless for runtime.
# - Docker pushes remain conditional and only happen on tag releases.

project_name: &name lvmsync

builds:
  - id: *name
    binary: *name
    env: [CGO_ENABLED=1]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: ["-trimpath"]
    ldflags:
      - "-s -w -X main.version={{.Version}}"

archives:
  - id: default
    builds: [*name]
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    format_overrides:
      - goos: linux
        format: tar.gz

checksum:
  name_template: '{{ .ProjectName }}-{{ .Version }}-checksums.txt'

sboms:
  - id: binary
    artifacts: binary
  - id: archive
    artifacts: archive

dockers:
  # Build multi-arch image from distroless Dockerfile
  - id: bpm
    use: buildx
    dockerfile: Dockerfile.distroless
    platforms: ["linux/amd64", "linux/arm64"]

  # Build per-arch distroless images
  - id: lvmsync-amd64
    use: buildx
    dockerfile: Dockerfile.distroless
    platforms: ["linux/amd64"]
    image_templates:
      - docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}
      - ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}
    skip_push: '{{ or .IsSnapshot (eq (env "SKIP_DOCKER_PUSH") "true") }}'
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--build-arg=BIN={{ .ProjectName }}"
      - "--build-arg=GIT_SHA={{ .FullCommit }}"
      - "--build-arg=BUILD_PATH=."

  - id: lvmsync-arm64
    use: buildx
    dockerfile: Dockerfile.distroless
    platforms: ["linux/arm64"]
    image_templates:
      - docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8
      - ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--build-arg=BIN={{ .ProjectName }}"
      - "--build-arg=BUILD_PATH=."

docker_manifests:
  - name_template: "docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}"
    image_templates:
      - "docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "docker.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8"
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'
  - name_template: "ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}"
    image_templates:
      - "ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "ghcr.io/oferchen/{{ .ProjectName }}:{{ .Tag }}-arm64v8"
    skip_push: '{{ eq (env "SKIP_DOCKER_PUSH") "true" }}'
  
