---
# .slsa-goreleaser.yml
version: 2
builds:
  - id: lvmsync_go
    main: ./main.go
    env: [CGO_ENABLED=1]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
archives:
  - id: archives
    ids: [lvmsync_go]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
...
