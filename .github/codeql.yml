name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@v3

      - name: Upload SARIF output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: /home/runner/work/${{ github.repository }}/results/go.sarif

      - name: Print fallback info if scanning is disabled
        if: always()
        run: |
          echo "::warning::GitHub code scanning may not be enabled for this repository."
          echo "::info::SARIF output was uploaded as an artifact: 'codeql-sarif'"
          echo "::info::Enable code scanning here if available: https://github.com/${{ github.repository }}/settings/security_analysis"
