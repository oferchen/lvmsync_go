# super-linter.yml
name: Lint Code Base

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  super-linter:
    name: Super-Linter (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: [1.21, 1.22, 1.23, 1.24]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: main

      VALIDATE_ALL_CODEBASE: true
      VALIDATE_GO: true
      VALIDATE_YAML: true
      VALIDATE_JSON: true
      VALIDATE_MARKDOWN: true
      VALIDATE_MARKDOWN_PRETTIER: true
      VALIDATE_BASH: true
      VALIDATE_EDITORCONFIG: true
      VALIDATE_GITHUB_ACTIONS: true
      VALIDATE_DOCKERFILE_HADOLINT: true
      VALIDATE_CHECKOV: true

      GO_LINTER: golangci-lint
      GO_LINT_FLAGS: ./...
      GO_VERSION: ${{ matrix.go-version }}

      FIX_MARKDOWN: true
      FIX_MARKDOWN_PRETTIER: true
      FIX_YAML_PRETTIER: true

      DOCKERFILE_HADOLINT_FILE_NAME: .hadolint.yaml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install build dependencies (LVM2 support for CGO)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libdevmapper-dev libreadline-dev \
            uuid-dev libaio-dev liblvm2-dev \
            libselinux-dev libsepol-dev git curl

      - name: Build LVM2 (if needed)
        run: |
          if [ ! -f /usr/include/lvm2cmd.h ]; then
            git clone --depth=1 https://sourceware.org/git/lvm2.git
            cd lvm2
            ./configure \
              --prefix=/usr \
              --enable-cmdlib \
              --enable-pkgconfig \
              --disable-selinux \
              --disable-readline \
              --disable-udev_sync \
              --disable-udev_rules \
              --disable-nls \
              --disable-dmeventd
            make -j"$(nproc)"
            sudo make install
            cd ..
            rm -rf lvm2
          fi

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.0.0
