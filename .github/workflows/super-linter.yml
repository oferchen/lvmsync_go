name: Lint Code Base

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            build-essential libdevmapper-dev libreadline-dev \
            uuid-dev libaio-dev liblvm2-dev \
            libselinux-dev libsepol-dev \
            git curl

      - name: Clone and build LVM2 with lvm2cmd.h
        run: |
          git clone https://sourceware.org/git/lvm2.git
          cd lvm2
          ./configure \
            --prefix=/usr \
            --enable-cmdlib \
            --enable-pkgconfig \
            --disable-selinux \
            --disable-readline \
            --disable-udev_sync \
            --disable-udev_rules \
            --disable-nls \
            --disable-dmeventd
          make -j$(nproc)
          sudo make install

      - name: Verify required headers
        run: test -f /usr/include/lvm2cmd.h || { echo "Missing lvm2cmd.h!"; exit 1; }

      - name: Install Go mod dependencies
        run: |
          rm -f go.mod go.sum
          go mod init lvmsync_go
          go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --out-format=colored-line-number ./...
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: '-I/usr/include'

      - name: Super-Linter
        uses: super-linter/super-linter@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_GO: false
          FIX_GO: false
          FIX_GO_MODULES: false
          VALIDATE_MARKDOWN: true
          FIX_MARKDOWN: true
          FIX_MARKDOWN_PRETTIER: true
          VALIDATE_CPP: true
          FIX_YAML_PRETTIER: true
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CHECKOV: false
          VALIDATE_JSCPD: false
          DEFAULT_BRANCH: "main"
