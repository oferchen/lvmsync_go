# super-linter.yml
name: Lint Code Base

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  super-linter:
    name: Super-Linter (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: [1.21, 1.22, 1.23, 1.24]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: main
      VALIDATE_ALL_CODEBASE: true

      GO_LINTER: golangci-lint
      GO_LINT_FLAGS: ./...
      GO_VERSION: ${{ matrix.go-version }}

      FIX_GO_GOFMT: true
      FIX_GO_IMPORTS: true
      FIX_YAML_PRETTIER: true
      FIX_MARKDOWN: true
      FIX_MARKDOWN_PRETTIER: true

      IGNORE_GITIGNORED_FILES: true

    steps:
      - name: Checkout code (safe depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Hardened Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install LVM2 build dependencies (CGO)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libdevmapper-dev libreadline-dev \
            uuid-dev libaio-dev liblvm2-dev \
            libselinux-dev libsepol-dev git curl

      - name: Build LVM2 from source (if missing)
        run: |
          if [ ! -f /usr/include/lvm2cmd.h ]; then
            git clone --depth=1 https://sourceware.org/git/lvm2.git
            cd lvm2
            ./configure \
              --prefix=/usr \
              --enable-cmdlib \
              --enable-pkgconfig \
              --disable-selinux \
              --disable-readline \
              --disable-udev_sync \
              --disable-udev_rules \
              --disable-nls \
              --disable-dmeventd
            make -j"$(nproc)"
            sudo make install
            cd ..
            rm -rf lvm2
          fi

      - name: Run Super-Linter with auto-fix
        uses: super-linter/super-linter@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          FIX_GO_GOFMT: true
          FIX_GO_IMPORTS: true
          FIX_YAML_PRETTIER: true
          FIX_MARKDOWN: true
          FIX_MARKDOWN_PRETTIER: true
          IGNORE_GITIGNORED_FILES: true
          DEFAULT_BRANCH: main
          GO_LINTER: golangci-lint
          GO_LINT_FLAGS: ./...
          GO_VERSION: ${{ matrix.go-version }}

      - name: Detect and safely push autofixes (if any)
        run: |
          if ! git diff --quiet; then
            git add -u
            if ! git diff --cached --quiet; then
              commit_msg="chore: auto-fix lint issues [super-linter]"
              echo "Detected changes. Committing with message: '$commit_msg'"
              git commit -m "$commit_msg"
              git push origin HEAD:${{ github.ref_name }}
            else
              echo "No staged changes to commit."
            fi
          else
            echo "No working directory changes detected."
          fi
