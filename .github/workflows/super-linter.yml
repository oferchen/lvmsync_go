# .github/workflows/super-linter.yml
name: Lint Code Base

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

concurrency:
  group: super-linter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  super-linter:
    name: Super-Linter (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [1.21, 1.22, 1.23, 1.24]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: main
      VALIDATE_ALL_CODEBASE: true
      IGNORE_GITIGNORED_FILES: true
      IGNORE_GENERATED_FILES: true
      FILTER_REGEX_EXCLUDE: |
        (^|/)vendor/|(^|/)third_party/|(^|\.)git/|(^|/)dist/|(^|/)bin/|(^|/)coverage/|(^|/)docs/_site/|(^|/)node_modules/|\.pb\.go$
      # Go
      GO_LINTER: golangci-lint
      GO_VERSION: ${{ matrix.go }}
      # Optional: use compact output with annotations
      GO_LINT_FLAGS: "--out-format=github-actions ./..."
      # Markdown / YAML / Dockerfile configs
      MARKDOWN_CONFIG_FILE: .markdownlint.yml
      YAML_CONFIG_FILE: ""
      DOCKERFILE_HADOLINT_FILE_NAME: .hadolint.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Super-Linter
        uses: github/super-linter/slim@v6
        env:
          VALIDATE_ALL_CODEBASE: ${{ env.VALIDATE_ALL_CODEBASE }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_GITIGNORED_FILES: ${{ env.IGNORE_GITIGNORED_FILES }}
          IGNORE_GENERATED_FILES: ${{ env.IGNORE_GENERATED_FILES }}
          FILTER_REGEX_EXCLUDE: ${{ env.FILTER_REGEX_EXCLUDE }}
          GO_LINTER: ${{ env.GO_LINTER }}
          GO_LINT_FLAGS: ${{ env.GO_LINT_FLAGS }}
          GO_VERSION: ${{ env.GO_VERSION }}
          MARKDOWN_CONFIG_FILE: ${{ env.MARKDOWN_CONFIG_FILE }}
          DOCKERFILE_HADOLINT_FILE_NAME: ${{ env.DOCKERFILE_HADOLINT_FILE_NAME }}
