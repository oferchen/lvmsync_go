---
# .github/workflows/super-linter.yml
# OVERHEAD: Hardened Super-Linter workflow
# - Soft/Hard fail via SUPER_LINTER_STRICT
# - golangci-lint uses package pattern (./...) to avoid cross-dir issues
# - Skips auto-push on forks/protected branches/PRs
# - Cleans root-owned linter artifacts before committing
# - Robust commit flow (rebase + retries + [skip ci])
# - Status updates enabled (avoid 403s via permissions)
# - Concurrency per ref (prevents overlapping runs)
# - JSCPD reads local .jscpd.json (dashboards ignored there)
# - Uploads JSCPD HTML report as artifact

name: Super-Linter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  statuses: write

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPER_LINTER_STRICT: "true" # set "false" to soft-fail the job
  JSCPD_IGNORE: "${{ github.workspace }}/*.json"

jobs:
  super-linter:
    name: Super-Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout (with credentials for potential push)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.0.0
        env:
          # Core
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          # Validate all code on PRs; changed files only on direct pushes
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          VALIDATE_GIT_COMMITLINT: "false"
          FILTER_REGEX_INCLUDE: ""

          # Go: pass ONLY the package pattern (NO "run")
          GO_LINTER: golangci-lint
          GO_LINT_FLAGS: ./...
          GOLANGCI_LINT_VERSION: v2.3.1

          # Formatters
          FIX_GO_GOFMT: true
          FIX_GO_IMPORTS: true
          FIX_YAML_PRETTIER: true
          FIX_MARKDOWN: true
          FIX_MARKDOWN_PRETTIER: true

          LINTER_RULES_PATH: .
          JSCPD_CONFIG_FILE: .jscpd.json
          # Optional: keep if you truly want to ignore all JSON except the config; prefer to define ignores inside .jscpd.json.
          JSCPD_IGNORE: "**/*.json"

          DOCKERFILE_HADOLINT_FILE_NAME: .hadolint.yaml
          DOCKERFILE_HADOLINT_CONFIG_FILE: .hadolint.yaml
          IGNORE_GENERATED_FILES: true
          IGNORE_GITIGNORED_FILES: true

          # Exclude only the JSCPD config itself from other linters' scans;
          # keep dashboards handled via .jscpd.json ignore list
          FILTER_REGEX_EXCLUDE: '(^|/)\.jscpd\.json$'
        continue-on-error: ${{ env.SUPER_LINTER_STRICT != 'true' }}

      - name: Cleanup linter artifacts
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sudo rm -rf github_conf super-linter-output || rm -rf github_conf super-linter-output || true

      - name: Auto-commit and push fixes (if needed)
        if: >
          always() &&
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          !github.ref_protected &&
          github.event.repository.fork == false
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config --global safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

          # Quick exit if nothing changed
          if ! git status --porcelain | grep -q .; then
            echo "No working directory changes detected."
            exit 0
          fi

          git add -A

          # Exit if nothing staged
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi

          # Rebase to avoid non-FF push
          git fetch --no-tags --prune origin \
            "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          if ! git rebase --autostash "origin/${BRANCH_NAME}"; then
            echo "Rebase failed; aborting."
            git rebase --abort || true
            exit 1
          fi

          # Single commit; skip CI to avoid loops
          msg="chore: auto-fix lint issues [super-linter] [skip ci]"
          git commit -m "$msg" \
            --author="github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            --no-verify || {
            echo "No commit created (nothing to commit)."
            exit 0
          }

          # Push with retries
          for i in 1 2 3; do
            if git push origin "HEAD:${BRANCH_NAME}"; then
              echo "Pushed auto-fix commit to ${BRANCH_NAME}."
              exit 0
            fi
            echo "Push attempt ${i} failed; refetching and retrying..."
            git fetch --no-tags --prune origin \
              "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
            git rebase --autostash "origin/${BRANCH_NAME}" || { git rebase --abort || true; }
          done

          echo "Failed to push auto-fix commit after retries."
          exit 1
