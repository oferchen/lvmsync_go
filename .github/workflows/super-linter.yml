name: Lint Code Base

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: [1.21, 1.22, 1.23, 1.24]

    name: Lint on Go ${{ matrix.go-version }}
    env:
      GO111MODULE: "on"
      CGO_ENABLED: "1"
      CGO_CFLAGS: "-I/usr/include"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            build-essential libdevmapper-dev libreadline-dev \
            uuid-dev libaio-dev liblvm2-dev \
            libselinux-dev libsepol-dev \
            git curl

      - name: Build LVM2 from source (only if needed)
        run: |
          if [ ! -f /usr/include/lvm2cmd.h ]; then
            echo "🔧 lvm2cmd.h not found, building LVM2 from source"
            git clone --depth=1 https://sourceware.org/git/lvm2.git
            cd lvm2
            ./configure \
              --prefix=/usr \
              --enable-cmdlib \
              --enable-pkgconfig \
              --disable-selinux \
              --disable-readline \
              --disable-udev_sync \
              --disable-udev_rules \
              --disable-nls \
              --disable-dmeventd
            make -j"$(nproc)"
            sudo make install
            cd ..
            rm -rf lvm2
          else
            echo "lvm2cmd.h already present, skipping build"
          fi

      - name: Ensure Go module is initialized
        run: |
          if [ ! -f go.mod ]; then
            echo "Initializing go.mod"
            go mod init lvmsync_go
          fi
          go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.3.1
          args: ./...

      - name: Run Super-Linter (non-Go)
        uses: super-linter/super-linter@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#          VALIDATE_GO: false
          FIX_GO: true
          FIX_GO_MODULES: true
#         VALIDATE_MARKDOWN: true
          FIX_MARKDOWN: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_YAML_PRETTIER: true
          VALIDATE_ALL_CODEBASE: true
#          VALIDATE_CHECKOV: false
#          VALIDATE_JSCPD: false
          DEFAULT_BRANCH: "main"
