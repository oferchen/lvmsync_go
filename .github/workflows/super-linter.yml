# super-linter.yml
name: Lint Code Base

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  golangci-lint:
    name: GoLint ${{ matrix.go-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: [1.21, 1.22, 1.23, 1.24]

    env:
      GO111MODULE: "on"
      CGO_ENABLED: "1"
      CGO_CFLAGS: "-I/usr/include"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libdevmapper-dev libreadline-dev \
            uuid-dev libaio-dev liblvm2-dev \
            libselinux-dev libsepol-dev git curl

      - name: Build LVM2 (if needed)
        run: |
          if [ ! -f /usr/include/lvm2cmd.h ]; then
            git clone --depth=1 https://sourceware.org/git/lvm2.git
            cd lvm2
            ./configure \
              --prefix=/usr \
              --enable-cmdlib \
              --enable-pkgconfig \
              --disable-selinux \
              --disable-readline \
              --disable-udev_sync \
              --disable-udev_rules \
              --disable-nls \
              --disable-dmeventd
            make -j"$(nproc)"
            sudo make install
            cd ..
            rm -rf lvm2
          fi

      - name: Ensure Go module
        run: |
          test -f go.mod || go mod init lvmsync_go
          go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3.1
          args: --timeout=3m ./...

  super-linter:
    name: Super-Linter (non-Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Super-Linter
        uses: super-linter/super-linter@v8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: true

          # GO handled by golangci-lint
          # VALIDATE_GO: false

          # Enable specific linters as needed
          # VALIDATE_YAML: true
          # VALIDATE_JSON: true
          # VALIDATE_MARKDOWN: true
          # VALIDATE_BASH: true
          # VALIDATE_EDITORCONFIG: true
          # VALIDATE_GITHUB_ACTIONS: true
          # VALIDATE_DOCKERFILE_HADOLINT: true
          # VALIDATE_CHECKOV: true

          FIX_MARKDOWN: true
          FIX_MARKDOWN_PRETTIER: true
          FIX_YAML_PRETTIER: true

          DOCKERFILE_HADOLINT_FILE_NAME: .github/linters/.hadolint.yaml
