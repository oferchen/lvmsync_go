---
# This workflow builds and publishes a new release when a tag is pushed.
# It uses GoReleaser to release binaries and Docker multi-arch images.

name: "Release a tag"

on:
  push:
    tags:
      - v*  # Trigger on version tags like v1.2.3

permissions:
  contents: read

jobs:
  release:
    name: Create and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GO_VERSION: "${{ vars.GO_VERSION || '1.24' }}"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "${{ vars.GO_VERSION || '1.24.x' }}"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            build-essential libdevmapper-dev libreadline-dev \
            uuid-dev libaio-dev \
            libselinux-dev libsepol-dev \
            git curl

      - name: Configure reproducible builds
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
          echo "GOFLAGS=-trimpath -buildvcs=false" >> $GITHUB_ENV

      - name: Set up QEMU for cross-compilation
        uses: docker/setup-qemu-action@v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Build distroless image
        run: |
          docker buildx build \
            --platform=linux/amd64 \
            --build-arg BIN=lvmsync \
            --build-arg BUILD_PATH=. \
            --build-arg GIT_SHA=${{ github.sha }} \
            --load \
            -f Dockerfile.distroless \
            -t lvmsync:test .

      - name: Smoke test distroless image
        run: docker run --rm lvmsync:test --version

      - name: Conditionally allow Docker push
        run: |
          if [[ "${{ github.repository }}" == "oferchen/lvmsync_go" ]]; then
            echo "SKIP_DOCKER_PUSH=false" >> "$GITHUB_ENV"
          else
            echo "SKIP_DOCKER_PUSH=true" >> "$GITHUB_ENV"
          fi

      - name: Docker login to DockerHub
        if: env.SKIP_DOCKER_PUSH == 'false'
        run: |
          echo "${{ secrets.GOLANGCI_LINT_DOCKER_TOKEN }}" | \
            docker login -u "golangci" --password-stdin

      - name: Docker login to GHCR (optional)
        if: env.SKIP_DOCKER_PUSH == 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install GoReleaser
        run: |
          curl -sL https://github.com/goreleaser/goreleaser/releases/download/v1.26.2/goreleaser_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin goreleaser

      - name: Run GoReleaser
        run: goreleaser release --clean --timeout=90m
        env:
          GITHUB_TOKEN: ${{ secrets.GOLANGCI_LINT_TOKEN }}
          SKIP_DOCKER_PUSH: ${{ env.SKIP_DOCKER_PUSH }}

      - name: Compute provenance subjects
        id: prov-subjects
        run: |
          echo "subjects=$(sha256sum dist/* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1
        with:
          base64-subjects: ${{ steps.prov-subjects.outputs.subjects }}
          provenance-name: dist/provenance.intoto.jsonl

      - name: Verify release artifacts
        run: |
          ls dist/*checksums.txt
          ls dist/*.sbom.json
          ls dist/*.intoto.jsonl

      - name: Attach checksums, SBOM, and provenance to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*checksums.txt
            dist/*.sbom.json
            dist/*.intoto.jsonl

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/*checksums.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*.sbom.json

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: dist/*.intoto.jsonl
