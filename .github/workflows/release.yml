# This workflow builds and publishes a new release when a tag is pushed.
# It uses GoReleaser to build and release binaries, and Docker to publish images.
# It conforms to Checkov CKV2_GHA_1 by avoiding implicit write-all permissions.

name: "Release a tag"

on:
  push:
    tags:
      - v*  # Triggers on version tags like v1.2.3

# ✅ Explicit top-level minimal permissions
permissions:
  contents: read

jobs:
  release:
    name: Create and publish release
    runs-on: ubuntu-latest

    # ✅ Job-level permission escalation: only this job can publish content
    permissions:
      contents: write  # Needed by GoReleaser to create GitHub releases

    env:
      GO_VERSION: '1.24.5'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            build-essential libdevmapper-dev libreadline-dev \
            uuid-dev libaio-dev \
            libselinux-dev libsepol-dev \
            git curl

      - name: Set up QEMU for cross-compilation
        uses: docker/setup-qemu-action@v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.0.0

      - name: Login to DockerHub
        run: docker login -u golangci -p ${{ secrets.GOLANGCI_LINT_DOCKER_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6.0.0
        with:
          version: latest
          args: release --clean --timeout=90m
        env:
          GITHUB_TOKEN: ${{ secrets.GOLANGCI_LINT_TOKEN }}
