---
# .github/workflows/go.yml

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "${{ vars.GO_VERSION || '1.24.x' }}" ]
    permissions:
      contents: write
    env:
      GO111MODULE: "on"
      CGO_ENABLED: "1"
      CGO_CFLAGS: "-I/usr/include"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Auto-fix gofmt/goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          modpath="$(go list -m)"
          gofmt -s -w .
          goimports -w -local "${modpath}" .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(fmt): apply gofmt and goimports [skip ci]"
            git push
          fi

      - name: Ensure module path matches repository
        run: |
          repo_mod="github.com/${GITHUB_REPOSITORY}"
          if [ ! -f go.mod ]; then
            echo "No go.mod found. Initializing module '${repo_mod}'..."
            go mod init "${repo_mod}"
          fi
          current_mod="$(awk '/^module /{print $2}' go.mod)"
          if [ "${current_mod}" != "${repo_mod}" ]; then
            echo "go.mod declares module '${current_mod}', expected '${repo_mod}'."
            echo "Please set:  module ${repo_mod}"
            exit 1
          fi

      - name: Tidy & verify modules
        run: |
          go mod tidy
          go mod verify
          # Enforce committed state
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod/go.sum changed after tidy. Commit the changes."; exit 1; }

      - name: Build project
        run: go build -v ./...

      - name: Run tests
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Enforce coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          awk -v p="$pct" 'BEGIN { if (p < 50) { printf("coverage %.2f%% is below 50%%\n", p); exit 1 } }'
