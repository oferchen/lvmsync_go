---
# .github/workflows/go.yml
# "${{ github.workspace }}/.github/workflows/go.yml

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ "${{ GO-VERSION }}" ]
    permissions:
      contents: write
    env:
      GO111MODULE: "on"
      CGO_ENABLED: "1"
      CGO_CFLAGS: "-I/usr/include"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: >-
            ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Auto-fix gofmt/goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          modpath="$(go list -m)"
          gofmt -s -w .
          goimports -w -local "${modpath}" .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(fmt): apply gofmt and goimports [skip ci]"
            git push
          fi

      - name: Ensure module is lvmsync_go (init if missing, fail if mismatch)
        run: |
          if [ ! -f go.mod ]; then
            echo "No go.mod found. Initializing module 'lvmsync_go'..."
            go mod init lvmsync_go
          fi
          mod_line=$(grep -E '^module ' go.mod | awk '{print $2}')
          if [ "$mod_line" != "lvmsync_go" ]; then
            echo "go.mod declares module '$mod_line' but must be 'lvmsync_go' for imports like 'lvmsync_go/...'."
            echo "Please set the module line to:  module lvmsync_go"
            exit 1
          fi

      - name: Tidy & verify modules
        run: |
          go mod tidy
          go mod verify
          # Enforce committed state
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod/go.sum changed after tidy. Commit the changes."; exit 1; }

      - name: Build project
        run: go build -v ./...

      - name: Run tests
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: Enforce coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          awk -v p="$pct" 'BEGIN { if (p < 50) { printf("coverage %.2f%% is below 50%%\n", p); exit 1 } }'
