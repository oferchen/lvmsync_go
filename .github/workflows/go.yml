# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf automake libtool \
          libreadline-dev pkg-config \
          libdevmapper-dev uuid-dev \
          libselinux-dev libsepol-dev \
          make gcc curl git

    - name: Clone and build LVM2 with lvm2cmd support (skip libaio)
      run: |
        git clone https://sourceware.org/git/lvm2.git
        cd lvm2
        ./configure --prefix=/usr \
          --enable-cmdlib \
          --disable-thin \
          --disable-vdo \
          --disable-bcache \
          --disable-dmeventd \
          --disable-lockd \
          --disable-readline \
          --disable-pylvm \
          --disable-lvmlockd \
          --enable-static_link
        make -j$(nproc)
        sudo make install

    - name: Ensure lvm2cmd.h is present
      run: test -f /usr/include/lvm2cmd.h || { echo "ERROR: lvm2cmd.h missing"; exit 1; }

    - name: Set up Go
      uses: actions/setup-go@v5.5.0
      with:
        go-version: '1.24.5'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
