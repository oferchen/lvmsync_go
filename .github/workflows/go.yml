---
# .github/workflows/go.yml
# "${{ github.workspace }}/.github/workflows/go.yml

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.24]
    env:
      GO111MODULE: "on"
      CGO_ENABLED: "1"
      CGO_CFLAGS: "-I/usr/include"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: >-
            ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Verify formatting (gofmt + goimports)
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Run gofmt on the following files:"; echo "$fmt_out"; exit 1
          fi
          imp_out=$(goimports -l .)
          if [ -n "$imp_out" ]; then
            echo "Run goimports on the following files:"; echo "$imp_out"; exit 1
          fi

      - name: Ensure module is lvmsync_go (init if missing, fail if mismatch)
        run: |
          if [ ! -f go.mod ]; then
            echo "No go.mod found. Initializing module 'lvmsync_go'..."
            go mod init lvmsync_go
          fi
          mod_line=$(grep -E '^module ' go.mod | awk '{print $2}')
          if [ "$mod_line" != "lvmsync_go" ]; then
            echo "go.mod declares module '$mod_line' but must be 'lvmsync_go' for imports like 'lvmsync_go/...'."
            echo "Please set the module line to:  module lvmsync_go"
            exit 1
          fi

      - name: Tidy & verify modules
        run: |
          go mod tidy
          go mod verify
          # Enforce committed state
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod/go.sum changed after tidy. Commit the changes."; exit 1; }

      - name: Build project
        run: go build -v ./...

      - name: Run tests
        run: go test -v -cover ./...
