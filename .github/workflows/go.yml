# .github/workflows/go.yml
name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm64]
        go-version: ["${{ vars.GO_VERSION || '1.24.x' }}"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      GO111MODULE: "on"
      CGO_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Show Go env
        run: |
          go version
          go env

      - name: Install OS deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends jq make

      - name: Verify formatting (gofmt/goimports)
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          modpath="$(go list -m)"
          # verify, do not modify repo on CI
          fmt_diff=$(gofmt -s -l .)
          imp_diff=$(goimports -l -local "${modpath}" .)
          if [ -n "${fmt_diff}${imp_diff}" ]; then
            echo "The following files need formatting:"
            [ -n "${fmt_diff}" ] && echo "${fmt_diff}"
            [ -n "${imp_diff}" ] && echo "${imp_diff}"
            echo "Run: gofmt -s -w . && goimports -w -local ${modpath} ."
            exit 1
          fi

      - name: Ensure module path matches repository
        shell: bash
        run: |
          repo_mod="github.com/${GITHUB_REPOSITORY}"
          if [ ! -f go.mod ]; then
            echo "No go.mod found. Initializing module '${repo_mod}'..."
            go mod init "${repo_mod}"
          fi
          current_mod="$(awk '/^module /{print $2}' go.mod)"
          if [ "${current_mod}" != "${repo_mod}" ]; then
            echo "go.mod declares module '${current_mod}', expected '${repo_mod}'."
            echo "Please set:  module ${repo_mod}"
            exit 1
          fi

      - name: Tidy & verify modules
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod/go.sum changed after tidy. Commit locally and push."; exit 1; }

      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Build (all pkgs)
        run: go build ./...

      - name: Build lvmsync binary
        run: |
          if [ -d cmd/lvmsync ]; then
            go build -o lvmsync ./cmd/lvmsync
          else
            echo "cmd/lvmsync not found; skipping targeted build."
          fi

      - name: Benchmark smoke test (optional)
        if: hashFiles('scripts/bench_smoke.sh') != ''
        run: |
          bash scripts/bench_smoke.sh

      - name: Post benchmark results
        if: always()
        run: |
          if [ -f reports/bench_smoke.csv ]; then
            echo "### Benchmark smoke test" >> "$GITHUB_STEP_SUMMARY"
            echo "| Compression | Throughput (MB/s) | CPU (%) |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------------|-------------------|---------|" >> "$GITHUB_STEP_SUMMARY"
            tail -n2 reports/bench_smoke.csv | awk -F, '{printf "| %s | %s | %s |\n", $2, $3, $4}' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Go vet
        env:
          LVMSYNC_STRICT_CONFIG: 1
        run: go vet ./...

      - name: Staticcheck
        run: staticcheck ./...

      - name: golangci-lint
        run: golangci-lint run

      - name: Go test (race + cover)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Root tests
        run: sudo make test-root

      - name: Integration tests (PR)
        if: github.event_name == 'pull_request' && startsWith(matrix.os, 'ubuntu-')
        run: |
          if [ -f Makefile ] && grep -q '^integration:' Makefile; then
            make integration
          else
            echo "No integration target; skipping."
          fi

      - name: Verify prune candidates
        if: hashFiles('cmd/reachmap/**','cmd/reachmap/*','cmd/reachmap') != ''
        run: |
          go run ./cmd/reachmap > .prune_candidates.txt
          if [ -s .prune_candidates.txt ]; then
            echo "Found prune candidates:"
            sed -n '1,200p' .prune_candidates.txt
            exit 1
          fi

      - name: Verify gaps resolved
        run: |
          if [ -f reports/machine/gaps.json ]; then
            jq -e 'map(select(.type | contains("(resolved)") | not)) | length == 0' reports/machine/gaps.json
          fi

      - name: Docs check
        run: make docs-check

      - name: Verify sudoers commands
        if: hashFiles('scripts/verify_sudoers.sh') != ''
        run: bash scripts/verify_sudoers.sh

      - name: Show coverage (summary)
        if: always() && hashFiles('coverage.out') != ''
        run: |
          go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage threshold
        if: hashFiles('coverage.out') != ''
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          awk -v p="$pct" 'BEGIN { if (p+0 < 50) { printf("coverage %.2f%% is below 50%%\n", p); exit 1 } }'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}
          path: reports
          if-no-files-found: ignore

  rsync:
    runs-on: ubuntu-24.04
    env:
      GO111MODULE: "on"
      CGO_ENABLED: "1"
    steps:
      - name: Install rsync
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends rsync || true
      - name: Check rsync availability
        id: rsync
        run: |
          if command -v rsync >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "rsync not found; skipping tests"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.rsync.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        if: steps.rsync.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "${{ vars.GO_VERSION || '1.24.x' }}"
          cache: true

      - name: Build with rsync and integration tags
        if: steps.rsync.outputs.present == 'true'
        run: go build -tags 'rsync integration' ./...
      - name: Test with rsync and integration tags
        if: steps.rsync.outputs.present == 'true'
        run: go test -tags 'rsync integration' -coverprofile=coverage-rsync.out ./... -- --allow-insecure

      - name: Show rsync coverage (summary)
        if: steps.rsync.outputs.present == 'true' && hashFiles('coverage-rsync.out') != ''
        run: |
          go tool cover -func=coverage-rsync.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload rsync coverage
        if: steps.rsync.outputs.present == 'true' && hashFiles('coverage-rsync.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rsync
          path: coverage-rsync.out
          if-no-files-found: error
