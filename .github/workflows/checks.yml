---
# .github/workflows/checks.yml

name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "${{ vars.GO_VERSION || '1.24' }}"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --config=.golangci.yml

  go-vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "${{ vars.GO_VERSION || '1.24' }}"
          cache: true

      - name: Go vet
        env:
          LVMSYNC_STRICT_CONFIG: 1
        run: go vet ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "${{ vars.GO_VERSION || '1.24' }}"
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "${{ vars.GO_VERSION || '1.24' }}"
          cache: true

      - name: Go test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Root tests
        run: sudo make test-root

      - name: Show coverage
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Enforce coverage threshold
        run: |
          pct=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $3}' | tr -d '%')
          awk -v p="$pct" 'BEGIN { if (p < 50) { printf("coverage %.2f%% is below 50%%\n", p); exit 1 } }'

  visudo:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install sudo
        run: apt-get update && apt-get install -y sudo

      - name: Validate sudoers file
        run: visudo -cf docs/sudoers.d/lvmsync

  jscpd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run jscpd
        run: npx -y jscpd --config .jscpd.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "${{ vars.GO_VERSION || '1.24' }}"
          cache: true

      - name: Docs check
        run: make docs-check

  rsync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: "${{ vars.GO_VERSION || '1.24' }}"
          cache: true

      - name: Build with rsync tag
        run: go build -tags rsync ./...

      - name: Test with rsync tag
        run: go test -tags rsync ./...
