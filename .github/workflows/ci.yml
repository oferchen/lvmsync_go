name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: almalinux:8

    steps:
      - name: Install system dependencies
        run: |
          dnf -y install git golang tar gzip curl
          go version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go module cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Ensure go.mod initialized (lvmsync_go)
        run: |
          if [ ! -f go.mod ]; then
            echo "Initializing go.mod with module 'lvmsync_go'"
            go mod init lvmsync_go
          fi

      - name: Resolve and verify module dependencies
        run: |
          go mod tidy
          go mod download
      
      - name: Install golangci-lint v1.54.2
        run: |
          curl -sSL https://github.com/golangci/golangci-lint/releases/download/v1.54.2/golangci-lint-1.54.2-linux-amd64.tar.gz | tar xz
          install -m 0755 golangci-lint-1.54.2-linux-amd64/golangci-lint /usr/local/bin/golangci-lint
      
      - name: Run golangci-lint
        run: |
          golangci-lint run --out-format=github-actions
        env:
          GOFLAGS: "-buildvcs=false"

  build-test:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: almalinux:8

    strategy:
      matrix:
        go-version: ['1.21', '1.22']

    steps:
      - name: Install system dependencies
        run: |
          dnf -y install git tar gzip
          go version

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Go module cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Ensure go.mod initialized (lvmsync_go)
        run: |
          if [ ! -f go.mod ]; then
            echo "Initializing go.mod with module 'lvmsync_go'"
            go mod init lvmsync_go
          fi

      - name: Resolve and verify module dependencies
        run: |
          go mod tidy
          go mod download

      - name: Format check
        run: |
          fmt_out=$(go fmt ./...)
          if [ -n "$fmt_out" ]; then
            echo "::error::The following files need formatting:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet code
        run: go vet ./...

      - name: Build
        run: go build -v -buildvcs=false ./...

      - name: Run tests with coverage
        run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
