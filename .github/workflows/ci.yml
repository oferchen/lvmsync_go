name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: almalinux:8

    steps:
      - name: Install system dependencies
        run: |
          dnf -y install git golang tar gzip
          go version

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go module cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Ensure go.mod initialized (lvmsync_go)
        run: |
          if [ ! -f go.mod ]; then
            echo "Initializing go.mod with module 'lvmsync_go'"
            go mod init lvmsync_go
          fi

      - name: Resolve and verify module dependencies
        run: |
          go mod tidy
          go mod download
          go list -e -json -compiled ./... > /dev/null

      - name: Format check
        run: |
          fmt_out=$(go fmt ./...)
          if [ -n "$fmt_out" ]; then
            echo "::error::The following files need formatting:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet code
        run: go vet ./...

      - name: Build
        run: go build -v -buildvcs=false ./...

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
