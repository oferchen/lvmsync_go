---
# config.yaml - LVMSync default configuration

# Apply mode: read change dump from file ('-' for STDIN)
# and apply to destination device
apply: ""
stdout: false  # Write change dump to STDOUT
dry-run: false  # Print actions without executing (same as --dry-run)
parallel: 4  # Number of concurrent workers
# Enable zero-copy transfers (only in sequential mode)
zerocopy: false
max_retries: 3  # Maximum number of retries per block
resume: ""  # Path to resume state file
sync_interval: "1GB"  # Bytes between fdatasync calls

# Manifest Options
manifest_timeout: 1m  # Timeout for manifest rebuild (0 disables)

# gRPC Options
grpc_port: 8443  # gRPC port to listen on
grpc_dial_timeout: 5s  # gRPC dial timeout
grpc_setup_timeout: 10s  # gRPC setup timeout
grpc_heartbeat_interval: 30s  # gRPC heartbeat interval
grpc_heartbeat_send_timeout: 5s  # gRPC heartbeat send timeout
tls_cert: ""  # TLS certificate file
tls_key: ""  # TLS key file
ca_cert: ""  # CA certificate file
allow_insecure: false  # Allow running without TLS

# Deduplication Options
# Strategy: "none", "auto", "checksum", "rolling_hash", or "bloom"
# (use "none" to disable)
dedup_strategy: "none"
dedup_state_file: "~/.lvmsync_dedup"  # Path to deduplication state file
# Enable intra-run deduplication to skip repeating chunks
intra_dedup: false
# Estimated number of entries for bloom filter
bloom_entries: 1000000
bloom_fp_rate: 0.01  # False positive rate for bloom filter

ssh_user: "root"  # SSH username
# Path to SSH private key or use SSH agent
ssh_key: ""
ssh_port: 22  # SSH port
known_hosts: "/root/.ssh/known_hosts"  # Path to known_hosts file
strict_host_key_checking: true  # Enable SSH StrictHostKeyChecking

# Remote command to run (e.g. "lvmsync", "sudo lvmsync", etc.)
lvmsync_path: "lvmsync"

# Remote script to run before starting transfer
remote_pre_script: ""
# Remote script to run after finishing transfer
remote_post_script: ""

# Compression method (options: "none", "lz4", "zstd", "auto")
compress: "auto"
# Zstd compression level (1-5)
zstd_level: 1
# LZ4 compression level: fast or hc
lz4_level: fast
# Number of goroutines for compression (0 to use all cores)
compress_concurrency: 0
# Skip compression when estimated ratio exceeds this value
compress_threshold: 0.9
speed: "100MB"  # Speed limit (e.g. "100MB")
# Enable checksum verification for data integrity
verify_checksum: false
# Digest algorithm (options: auto, sha256, blake3, blake3-512)
digest: auto
# Checksum algorithm (options: auto, sha256, blake3)
checksum_algorithm: auto

verbose: 0  # Verbosity level (0 = silent, higher numbers = more verbose)

# LVM Options:
skip_snapshot_creation: false  # Skip automatic snapshot creation
# Skip disk space check before snapshot creation
skip_disk_check: false
# Snapshot size as an absolute value (e.g. "20G")
# or as a percentage (e.g. "20%")
snapshot_size: "20%"
# Source volume group. Derived from the source path when empty
volume_group: ""
# Volume group name of the target LVM volume
target_volume_group: ""
target_vgs: [ ]  # Candidate target VGs for auto-selection
# Command used to re-execute the program with elevated privileges
# when required
lvm_escalation: "sudo -n"
lvm_timeout: 10s  # Timeout for LVM operations
progress: true  # Enable progress display during transfer
# Block size for LVM operations ('auto' or 0 for automatic detection)
block_size: "auto"

# Transport Options
transport: "quic,h2,tcp+tls,ssh"  # Ordered transports to try (comma-separated)
concurrency: 0  # Stream concurrency (0 to autotune)
tcp_port: 0  # TCP+TLS port
