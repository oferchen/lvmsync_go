version: "2"

run:
  timeout: 3m
  tests: true

output:
  format: colored-line-number

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-use-default: false
  skip-dirs:
    - vendor
    - .git
  skip-files:
    - ".*_gen.go"
    - ".*_test.go"

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - ineffassign
    - unused
    - gocritic
    - depguard
    - asciicheck
    - bodyclose
    - misspell

  settings:
    depguard:
      list-type: allow
      include-go-root: true
      packages:
        - github.com/spf13/viper
        - github.com/spf13/pflag
        - github.com/dustin/go-humanize
        - go.uber.org/zap/...
        - github.com/bits-and-blooms/bloom/v3
        - github.com/klauspost/compress/zstd
        - github.com/pierrec/lz4/v4
        - github.com/juju/ratelimit
        - golang.org/x/crypto/...
        - golang.org/x/sys/...
        - fmt
        - io
        - os
        - syscall
        - encoding/binary
        - time
        - lvmsync_go
        - lvmsync_go/...

    gocritic:
      enabled-checks:
        - rangeValCopy
        - appendCombine

    revive:
      severity: warning
      rules:
        - name: indent-error-flow
        - name: empty-block
        - name: blank-imports
        - name: var-naming
        - name: error-naming
        - name: unexported-return
        - name: function-length
          arguments: [50, 25]
        - name: cognitive-complexity
          arguments: [15]
        - name: time-naming
