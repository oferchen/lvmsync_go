version: 2

run:
  tests: true
  timeout: 3m
  skip-dirs:
    - vendor
    - .git
  skip-files:
    - ".*_gen.go"
    - ".*_test.go"

output:
  format: colored-line-number
  print-issued-lines: true
  sort-results: true

linters:
  enable:
    - govet                # Standard Go vetting
    - staticcheck          # Strong static analysis (SSA, nil, unused, etc.)
    - revive               # Style, naming, idiomatic patterns
    - errcheck             # Check unhandled errors
    - ineffassign          # Ineffectual assignments
    - unused               # Unused variables, functions, constants
    - gocritic             # Code quality checks
    - depguard             # Import restrictions
    - asciicheck           # Disallow non-ASCII literals
    - bodyclose            # Verify HTTP response bodies are closed
    - misspell             # Spelling mistakes

linters-settings:
  depguard:
    list-type: allow
    include-go-root: true
    packages:
      - github.com/spf13/viper
      - github.com/spf13/pflag
      - github.com/dustin/go-humanize
      - go.uber.org/zap/...
      - github.com/bits-and-blooms/bloom/v3
      - github.com/klauspost/compress/zstd
      - github.com/pierrec/lz4/v4
      - github.com/juju/ratelimit
      - golang.org/x/crypto/...
      - golang.org/x/sys/...
      - fmt
      - io
      - os
      - syscall
      - encoding/binary
      - time
      - lvmsync_go
      - lvmsync_go/...

  gocritic:
    enabled-checks:
      - rangeValCopy
      - ifElse
      - captLocal
      - commentFormatting
      - unlambda
      - appendCombine

  revive:
    severity: warning
    ignore-generated-header: true
    rules:
      - name: indent-error-flow
      - name: empty-block
      - name: blank-imports
      - name: var-naming
      - name: error-naming
      - name: unexported-return
      - name: function-length
      - name: cognitive-complexity
      - name: time-naming

  errcheck:
    check-type-assertions: true
    exclude:
      - "defer .*\\.Close\\(\\)"

  goimports:
    local-prefixes: github.com/oferchen/lvmsync_go

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
