version: "2"

run:
  timeout: 3m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - ineffassign
    - unused
    - gocritic
    - asciicheck
    - bodyclose
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - "(*os.File).Close"
        - "signal.Stop"
        - "os.Remove"
        - "fmt.Fprintf"
        - "fmt.Fprint"
        - "fmt.Fprintln"
        - "io.Copy"
        - "(*bytes.Buffer).Write"
        - "(*bytes.Buffer).ReadFrom"

    gocritic:
      enabled-checks:
        - rangeValCopy
        - appendCombine

    revive:
      severity: warning
      rules:
        - name: indent-error-flow
        - name: empty-block
        - name: blank-imports
        - name: var-naming
        - name: error-naming
        - name: unexported-return
        - name: function-length
          arguments: [120, 100]
        - name: cognitive-complexity
          arguments: [15]
        - name: time-naming
