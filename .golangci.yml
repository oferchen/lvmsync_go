# .golangci.yml
run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _generated/|mock/|mocks/|vendor/|third_party/
      linters: [all]
    - path: \.pb\.go$
      linters: [all]

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - gocritic
    - revive
    - misspell
    - bodyclose
    - asciicheck
    - typecheck
  disable:
    - depguard

linters-settings:
  revive:
    severity: warning
    rules:
      - name: indent-error-flow
      - name: errorf
      - name: early-return
      - name: if-return
      - name: import-shadowing
      - name: receiver-naming
      - name: time-naming
      - name: unreachable-code
  errcheck:
    # Keep strict per user's guideline: do not ignore Close errors, etc.
    check-type-assertions: true
    check-blank: true
  gocritic:
    enabled-checks:
      - appendAssign
      - ifElseChain
      - nestedExpr
      - paramTypeCombine
      - ptrToRefParam
      - rangeExprCopy
      - sloppyReassign
      - sortSlice
      - underef
      - unlambda
  misspell:
    locale: US
