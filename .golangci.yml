run:
  timeout: 3m
  tests: true

linters-settings:
  depguard:
    list-type: allow
    include-go-root: true
    packages:
      - github.com/spf13/viper
      - github.com/spf13/pflag
      - github.com/dustin/go-humanize
      - go.uber.org/zap
      - github.com/bits-and-blooms/bloom/v3
      - github.com/klauspost/compress/zstd
      - github.com/pierrec/lz4/v4
      - github.com/juju/ratelimit
      - golang.org/x/crypto/...
      - golang.org/x/sys/unix
      - golang.org/x/sys/cpu
      - fmt
      - io
      - os
      - syscall
      - encoding/binary
      - time
      - lvmsync_go
      - lvmsync_go/config
      - lvmsync_go/remote
      - lvmsync_go/transfer
      - lvmsync_go/common
    include-go-root: true

  gocritic:
    enabled-checks:
      - rangeValCopy
      - ifElseChain
      - boolExprSimplify
      - unlambda

  revive:
    severity: warning
    ignore-generated-header: true
    rules:
      - name: indent-error-flow
      - name: empty-block
      - name: blank-imports
      - name: var-naming
      - name: error-naming

  errcheck:
    check-type-assertions: true

  unused:
    check-exported: true

  goimports:
    local-prefixes: github.com/oferchen/lvmsync_go

linters:
  enable:
    - govet
    - staticcheck
    - revive
    - errcheck
    - gofmt
    - goimports
    - ineffassign
    - unused
    - typecheck
    - gocritic
    - depguard
  disable:
    - lll
    - gocyclo
    - dupl
    - nakedret
    - prealloc

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  skip-dirs:
    - vendor
    - .git
  skip-files:
    - ".*_gen.go"
    - ".*_test.go"

output:
  format: colored-line-number
  print-issued-lines: true
  sort-results: true

