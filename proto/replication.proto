syntax = "proto3";

package replication;

option go_package = "lvmsync_go/proto;proto";

message VolumeMetadata {
  string volume_name = 1;
  uint64 size_bytes = 2;
  uint64 chunk_size = 3;
}

message LockRequest {
  string volume_name = 1;
  string requester = 2;
}

message StatusResponse {
  bool ok = 1;
  string message = 2;
}

message Empty {}

message HandshakeRequest {
  uint32 sector_size = 1;
  uint32 alignment = 2;
  uint32 max_concurrency = 3;
  bool dedup_supported = 4;
  bool compression_supported = 5;
}

message HandshakeResponse {
  bool ok = 1;
  string message = 2;
}

message SessionRequest {
  string volume_name = 1;
  string device_uuid = 2;
  bytes client_cert = 3;
}

message SessionResponse {
  string session_id = 1;
  bytes psk = 2;
  bytes server_cert = 3;
}

message ResumeBitmap {
  string session_id = 1;
  bytes bitmap = 2;
}

message ManifestMessage {
  string session_id = 1;
  bytes manifest = 2;
}

message FinalizeRequest { string session_id = 1; }

message Ack {
  string session_id = 1;
  bool ok = 2;
  string message = 3;
}

service Replication {
  rpc LockVolume(LockRequest) returns (StatusResponse);
  rpc GetVolumeMetadata(LockRequest) returns (VolumeMetadata);
  rpc SendVolumeMetadata(VolumeMetadata) returns (StatusResponse);
  rpc StartTransferSession(LockRequest) returns (StatusResponse);
  rpc FinalizeSync(LockRequest) returns (StatusResponse);
  rpc GetStatus(LockRequest) returns (StatusResponse);
  rpc Ping(Empty) returns (StatusResponse);
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
  rpc CreateSession(SessionRequest) returns (SessionResponse);
  rpc SendResumeBitmap(stream ResumeBitmap) returns (StatusResponse);
  rpc SendFinalManifest(ManifestMessage) returns (StatusResponse);
  rpc Finalize(FinalizeRequest) returns (StatusResponse);
  rpc AckStream(stream Ack) returns (stream Ack);
}
